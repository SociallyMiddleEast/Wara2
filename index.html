<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Table — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
/* ── Page centering ── */
body { display:flex; flex-direction:column; align-items:center; min-height:100vh; justify-content:center; }
.wrap { width:100%; max-width:400px; padding:24px 16px; }

/* ── Brand ── */
.brand-top { text-align:center; margin-bottom:28px; }
.brand-top .suits { font-size:1.2rem; letter-spacing:.5em; opacity:.6; margin-bottom:8px; }
.brand-top h1 { font-family:'Fraunces',serif; font-size:2rem; font-weight:700; margin:0; color:var(--gold); }

/* ── Card panel ── */
.auth-card {
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px 24px 22px;
}
.auth-card .eyebrow { font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; opacity:.45; font-weight:700; margin:0 0 4px; }
.auth-card h2 { font-family:'Fraunces',serif; font-size:1.45rem; font-weight:700; margin:0 0 22px; }

/* ── Social buttons ── */
.social-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:10px; }

.social-btn {
  position:relative;
  display:flex; align-items:center; justify-content:center; gap:7px;
  border-radius:10px; padding:10px 8px;
  font-size:.8rem; font-weight:600;
  cursor:pointer; font-family:'Inter',sans-serif;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:inherit;
  transition:background .15s, border-color .15s, transform .1s;
  white-space:nowrap;
}
.social-btn:hover:not(:disabled) {
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.22);
  transform:translateY(-1px);
}
.social-btn:active:not(:disabled) { transform:translateY(0); }
.social-btn:disabled { opacity:.32; cursor:not-allowed; }

/* soon badge */
.social-btn .soon-tag {
  position:absolute; top:-8px; right:-2px;
  background:var(--gold); color:#1a1612;
  font-size:.5rem; font-weight:800; letter-spacing:.05em;
  padding:2px 6px; border-radius:20px;
  text-transform:uppercase; pointer-events:none;
}

/* ── Divider ── */
.or-divider {
  display:flex; align-items:center; gap:10px;
  margin:0 0 18px;
  font-size:.7rem; text-transform:uppercase;
  letter-spacing:.08em; opacity:.35;
}
.or-divider::before, .or-divider::after { content:""; flex:1; border-top:1px solid var(--line); }

/* ── Form fields ── */
.field-group { display:flex; flex-direction:column; gap:4px; margin-bottom:14px; }
.field-group label { font-size:.75rem; font-weight:600; opacity:.65; letter-spacing:.02em; }
.field-group input {
  background:rgba(0,0,0,.2); border:1px solid var(--line);
  border-radius:9px; padding:11px 13px;
  font-size:.92rem; color:inherit; font-family:'Inter',sans-serif;
  transition:border-color .15s;
  width:100%; box-sizing:border-box;
}
.field-group input:focus { outline:none; border-color:var(--gold); }
.field-group input::placeholder { opacity:.35; }

/* ── Sign in button ── */
.btn-primary {
  width:100%; padding:13px;
  background:var(--gold); color:#1a1612;
  border:none; border-radius:50px;
  font-size:.95rem; font-weight:700;
  cursor:pointer; font-family:'Inter',sans-serif;
  transition:opacity .15s, transform .1s;
  margin-top:6px;
}
.btn-primary:hover { opacity:.9; transform:translateY(-1px); }
.btn-primary:active { transform:translateY(0); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }

/* ── Error ── */
.err { color:#e07070; font-size:.78rem; margin-top:8px; min-height:1rem; }

/* ── Pending box ── */
.pending-box {
  background:rgba(212,175,55,.08); border:1px solid rgba(212,175,55,.4);
  border-radius:10px; padding:13px 15px;
  font-size:.82rem; line-height:1.65; margin-top:10px; display:none;
}
.pending-box a { color:#6fae8d; font-weight:600; text-decoration:none; }

/* ── Footer links ── */
.auth-footer {
  display:flex; flex-direction:column; align-items:center;
  gap:9px; margin-top:20px;
  padding-top:18px; border-top:1px solid var(--line);
}
.auth-footer a {
  font-size:.8rem; opacity:.5; text-decoration:none;
  color:inherit; transition:opacity .15s;
}
.auth-footer a:hover { opacity:.9; }

/* ── Google button override ── */
#googleBtnInner {
  width: 100%;
}
#googleBtnInner > div,
#googleBtnInner iframe {
  width: 100% !important;
  border-radius: 10px !important;
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Brand -->
  <div class="brand-top">
    <div class="suits">♠ ♥ ♦ ♣</div>
    <h1>Card Table</h1>
  </div>

  <!-- Auth card -->
  <div class="auth-card">
    <p class="eyebrow">Sign in</p>
    <h2>Welcome back</h2>

    <!-- Social buttons -->
    <div class="social-grid">

      <!-- Google -->
      <div id="googleBtnInner" style="min-height:40px;"></div>

      <!-- Facebook -->
      <button class="social-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2">
          <path d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.268h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
        </svg>
        Facebook
        <span class="soon-tag">Soon</span>
      </button>

      <!-- Outlook -->
      <button class="social-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24">
          <rect fill="#0078D4" width="13" height="14" rx="1.5" y="5"/>
          <path fill="#fff" d="M6.5 8.5a3 3 0 1 0 0 7 3 3 0 0 0 0-7zm0 5a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
          <path fill="#0072C6" d="M24 7.387v13.226A1.39 1.39 0 0 1 22.611 22H7.389A1.39 1.39 0 0 1 6 20.613V18l9-2.25L24 18V7.387z"/>
          <path fill="#28A8E0" d="M15 9.75l9-2.363V18l-9-2.25V9.75z" opacity=".7"/>
          <path fill="#0072C6" d="M24 7.387L15 9.75 6 7.387V5.388A1.39 1.39 0 0 1 7.389 4h15.222A1.39 1.39 0 0 1 24 5.388v2z" opacity=".8"/>
        </svg>
        Outlook
        <span class="soon-tag">Soon</span>
      </button>

      <!-- Apple -->
      <button class="social-btn" disabled>
        <svg width="13" height="16" viewBox="0 0 814 1000" fill="currentColor">
          <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-42.3-150.3-119.8c-52.4-91.3-95.2-234.5-95.2-371.3 0-223.1 145.5-341.2 289-341.2 73.7 0 134.8 48.4 180.5 48.4 43.7 0 112.4-51.9 197.5-51.9zm-166.6-19.4c-7.7 36.4-39 65.4-72.7 65.4-5.4 0-10.8-.7-16.1-2.2C540 356 570 316 570 276c0-5.1.7-10.2 2.2-15.3C607 270.4 634 299.3 621.5 321.5z"/>
        </svg>
        Apple
        <span class="soon-tag">Soon</span>
      </button>
    </div>

    <div class="or-divider">or continue with username</div>

    <!-- Username -->
    <div class="field-group">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="e.g. elie">
    </div>

    <!-- Password -->
    <div class="field-group">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <div class="err" id="loginError"></div>

    <div class="pending-box" id="pendingBox">
      ⏳ Your account is pending admin approval.<br>
      <a id="pendingWhatsApp" href="#" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;">
        💬 Message admin on WhatsApp →
      </a>
    </div>

    <button class="btn-primary" id="loginBtn">Sign in</button>

    <div class="auth-footer">
      <a href="signup.html">Don't have an account? <strong>Sign up</strong></a>
      <a href="forgot.html">Forgot password?</a>
    </div>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="common.js"></script>
<script>
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data     = encoder.encode(password);
  const hashBuf  = await crypto.subtle.digest("SHA-256", data);
  const hashArr  = Array.from(new Uint8Array(hashBuf));
  return hashArr.map(b => b.toString(16).padStart(2, "0")).join("");
}
</script>
<script>
const ADMIN_WA      = "+96170234138";
const GOOGLE_CLIENT = "719090679294-4ihaptgq611pqusbl5u95uiu03cabtub.apps.googleusercontent.com";

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
document.getElementById("username").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

async function login() {
  const errEl      = document.getElementById("loginError");
  const pendingBox = document.getElementById("pendingBox");
  errEl.textContent = "";
  pendingBox.style.display = "none";

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  if (!username || !password) { errEl.textContent = "Enter both username and password."; return; }

  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "Checking…";

  try {
    const users  = await fetchUsers();
    const hashed = await hashPassword(password);
    const match  = (users || []).find(u =>
      String(u.username).toLowerCase() === username.toLowerCase() &&
      (String(u.password) === hashed || String(u.password) === password)
    );

    if (!match) {
      errEl.textContent = "Username or password is incorrect.";
      btn.disabled = false; btn.textContent = "Sign in"; return;
    }

    if (String(match.approved).toUpperCase() !== "TRUE") {
      const msg = encodeURIComponent(`Hi, I signed up for Card Table with username "${match.username}" and I'm waiting for approval.`);
      document.getElementById("pendingWhatsApp").href = `https://wa.me/${ADMIN_WA.replace(/\D/g,"")}?text=${msg}`;
      pendingBox.style.display = "";
      btn.disabled = false; btn.textContent = "Sign in"; return;
    }

    startSession(match);
  } catch(e) {
    errEl.textContent = "Could not load user list. " + e.message;
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

function initGoogleSignIn() {
  if (typeof google === "undefined") { setTimeout(initGoogleSignIn, 400); return; }
  google.accounts.id.initialize({
    client_id:   GOOGLE_CLIENT,
    callback:    handleGoogleCredential,
    auto_select: false
  });
  const container = document.getElementById("googleBtnInner");
  if (!container) return;
  google.accounts.id.renderButton(container, {
    type:  "standard",
    theme: "outline",
    size:  "large",
    text:  "continue_with",
    shape: "rectangular",
    width: container.offsetWidth || 160
  });
}
window.addEventListener("load", initGoogleSignIn);

async function handleGoogleCredential(response) {
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";
  const payload = JSON.parse(atob(response.credential.split(".")[1]));
  const sub = payload.sub || "";
  try {
    const users = await fetchUsers();
    const expectedHash = await hashPassword("google_" + sub);
    const match = users.find(u => String(u.password) === expectedHash);

    if (!match) {
      errEl.textContent = "No account found for this Google account.";
      setTimeout(() => { window.location.href = "signup.html"; }, 2000);
      return;
    }
    if (String(match.approved).toUpperCase() !== "TRUE") {
      const msg = encodeURIComponent(`Hi, I signed up for Card Table with username "${match.username}" and I'm waiting for approval.`);
      document.getElementById("pendingWhatsApp").href = `https://wa.me/${ADMIN_WA.replace(/\D/g,"")}?text=${msg}`;
      document.getElementById("pendingBox").style.display = "";
      return;
    }
    startSession(match);
  } catch(e) {
    errEl.textContent = "Google sign-in failed: " + e.message;
  }
}

function startSession(user) {
  sessionStorage.setItem("cg_session", JSON.stringify({
    username: user.username, firstName: user.firstName, lastName: user.lastName,
    phone: user.phone || "", image: user.image || "", isAdmin: !!user.isAdmin
  }));
  window.location.href = "app.html";
}
</script>
</body>
</html>
