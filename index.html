<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Table — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
.auth-links {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
}
.auth-links a {
  font-size: .83rem;
  opacity: .65;
  text-decoration: none;
  color: inherit;
  transition: opacity .15s;
}
.auth-links a:hover { opacity: 1; }
.auth-links .divider {
  width: 100%;
  border: none;
  border-top: 1px solid var(--line);
  margin: 2px 0;
}
.pending-box {
  background: rgba(212,175,55,.08);
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: .84rem;
  line-height: 1.6;
  margin-top: 10px;
  display: none;
}
.pending-box a {
  color: #6fae8d;
  font-weight: 600;
  text-decoration: none;
}
.pending-box a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap" style="max-width:420px;">
  <div class="brand" style="justify-content:center; border-bottom:none; margin-bottom:36px;">
    <div style="text-align:center;">
      <div class="suit" style="display:block; margin-bottom:6px; font-size:1.4rem; letter-spacing:.4em;">♠ ♥ ♦ ♣</div>
      <h1>Card Table</h1>
    </div>
  </div>

  <div class="panel">
    <p class="eyebrow">Sign in</p>
    <h2 style="margin-top:0;">Welcome back</h2>

    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" placeholder="e.g. elie">

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">

    <div class="error" id="loginError"></div>
    <div class="pending-box" id="pendingBox">
      ⏳ Your account is pending admin approval.<br>
      Contact the admin on WhatsApp to get approved:
      <br><br>
      <a id="pendingWhatsApp" href="#" target="_blank" rel="noopener">
        💬 Message admin on WhatsApp
      </a>
    </div>

    <button class="full" id="loginBtn" style="margin-top:18px;">Sign in</button>

    <div class="auth-links">
      <hr class="divider">
      <a href="signup.html">Don't have an account? Sign up</a>
      <a href="forgot.html">Forgot password?</a>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data     = encoder.encode(password);
  const hashBuf  = await crypto.subtle.digest("SHA-256", data);
  const hashArr  = Array.from(new Uint8Array(hashBuf));
  return hashArr.map(b => b.toString(16).padStart(2, "0")).join("");
}
</script>
<script>
const ADMIN_WA = "+96170234138";

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

async function login() {
  const errEl     = document.getElementById("loginError");
  const pendingBox = document.getElementById("pendingBox");
  errEl.textContent = "";
  pendingBox.style.display = "none";

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !password) {
    errEl.textContent = "Enter both username and password.";
    return;
  }

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "Checking…";

  try {
    const users = await fetchUsers();
    const hashed = await hashPassword(password);
    const match = (users || []).find(
      u => String(u.username).toLowerCase() === username.toLowerCase() &&
           (String(u.password) === hashed || String(u.password) === password) // fallback for existing plain-text passwords
    );

    if (!match) {
      errEl.textContent = "Username or password is incorrect.";
      btn.disabled = false;
      btn.textContent = "Sign in";
      return;
    }

    // Check approval status
    // approved column: TRUE = approved, FALSE / empty / missing = pending
    const approved = String(match.approved).toUpperCase();
    if (approved !== "TRUE") {
      const msg = encodeURIComponent(
        `Hi, I signed up for Card Table with username "${match.username}" and I'm waiting for approval.`
      );
      document.getElementById("pendingWhatsApp").href =
        `https://wa.me/${ADMIN_WA.replace(/\D/g,"")}?text=${msg}`;
      pendingBox.style.display = "";
      btn.disabled = false;
      btn.textContent = "Sign in";
      return;
    }

    // Approved — save session and go
    sessionStorage.setItem("cg_session", JSON.stringify({
      username:  match.username,
      firstName: match.firstName,
      lastName:  match.lastName,
      phone:     match.phone  || "",
      image:     match.image  || "",
      isAdmin:   !!match.isAdmin
    }));
    window.location.href = "app.html";

  } catch(e) {
    errEl.textContent = "Could not load user list. " + e.message;
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
}
</script>
</body>
</html>
