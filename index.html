<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Table — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
.auth-links {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
}
.auth-links a {
  font-size: .83rem;
  opacity: .65;
  text-decoration: none;
  color: inherit;
  transition: opacity .15s;
}
.auth-links a:hover { opacity: 1; }
.auth-links .divider {
  width: 100%;
  border: none;
  border-top: 1px solid var(--line);
  margin: 2px 0;
}
.pending-box {
  background: rgba(212,175,55,.08);
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: .84rem;
  line-height: 1.6;
  margin-top: 10px;
  display: none;
}
.pending-box a { color: #6fae8d; font-weight: 600; text-decoration: none; }
.pending-box a:hover { text-decoration: underline; }

/* Google button */
.google-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: #fff;
  color: #3c4043;
  border: 1px solid #dadce0;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: .92rem;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: box-shadow .15s, background .15s;
  margin-bottom: 6px;
}
.google-btn:hover { background: #f8f9fa; box-shadow: 0 1px 6px rgba(0,0,0,.15); }

.or-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 14px 0;
  opacity: .45;
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.or-divider::before, .or-divider::after {
  content: "";
  flex: 1;
  border-top: 1px solid var(--line);
}
</style>
</head>
<body>
<div class="wrap" style="max-width:420px;">
  <div class="brand" style="justify-content:center; border-bottom:none; margin-bottom:36px;">
    <div style="text-align:center;">
      <div class="suit" style="display:block; margin-bottom:6px; font-size:1.4rem; letter-spacing:.4em;">♠ ♥ ♦ ♣</div>
      <h1>Card Table</h1>
    </div>
  </div>

  <div class="panel">
    <p class="eyebrow">Sign in</p>
    <h2 style="margin-top:0;">Welcome back</h2>

    <!-- Google sign-in -->
    <button class="google-btn" onclick="triggerGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/>
      </svg>
      Sign in with Google
    </button>

    <div class="or-divider">or</div>

    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" placeholder="e.g. elie">

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">

    <div class="error" id="loginError"></div>
    <div class="pending-box" id="pendingBox">
      ⏳ Your account is pending admin approval.<br>
      Contact the admin on WhatsApp to get approved:
      <br><br>
      <a id="pendingWhatsApp" href="#" target="_blank" rel="noopener">
        💬 Message admin on WhatsApp
      </a>
    </div>

    <button class="full" id="loginBtn" style="margin-top:18px;">Sign in</button>

    <div class="auth-links">
      <hr class="divider">
      <a href="signup.html">Don't have an account? Sign up</a>
      <a href="forgot.html">Forgot password?</a>
    </div>
  </div>
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="common.js"></script>
<script>
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data     = encoder.encode(password);
  const hashBuf  = await crypto.subtle.digest("SHA-256", data);
  const hashArr  = Array.from(new Uint8Array(hashBuf));
  return hashArr.map(b => b.toString(16).padStart(2, "0")).join("");
}
</script>
<script>
const ADMIN_WA      = "+96170234138";
const GOOGLE_CLIENT = "719090679294-4ihaptgq611pqusbl5u95uiu03cabtub.apps.googleusercontent.com";

// ── Manual login ──
document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

async function login() {
  const errEl      = document.getElementById("loginError");
  const pendingBox = document.getElementById("pendingBox");
  errEl.textContent = "";
  pendingBox.style.display = "none";

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  if (!username || !password) { errEl.textContent = "Enter both username and password."; return; }

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "Checking…";

  try {
    const users  = await fetchUsers();
    const hashed = await hashPassword(password);
    const match  = (users || []).find(u =>
      String(u.username).toLowerCase() === username.toLowerCase() &&
      (String(u.password) === hashed || String(u.password) === password) // plain-text fallback
    );

    if (!match) {
      errEl.textContent = "Username or password is incorrect.";
      btn.disabled = false; btn.textContent = "Sign in"; return;
    }

    // Check approval
    if (String(match.approved).toUpperCase() !== "TRUE") {
      const msg = encodeURIComponent(`Hi, I signed up for Card Table with username "${match.username}" and I'm waiting for approval.`);
      document.getElementById("pendingWhatsApp").href =
        `https://wa.me/${ADMIN_WA.replace(/\D/g,"")}?text=${msg}`;
      pendingBox.style.display = "";
      btn.disabled = false; btn.textContent = "Sign in"; return;
    }

    startSession(match);

  } catch(e) {
    errEl.textContent = "Could not load user list. " + e.message;
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

// ── Google sign-in ──
function triggerGoogleSignIn() {
  if (typeof google === "undefined") {
    document.getElementById("loginError").textContent = "Google sign-in failed to load. Try the manual form.";
    return;
  }
  google.accounts.id.initialize({
    client_id:    GOOGLE_CLIENT,
    callback:     handleGoogleCredential,
    auto_select:  false,
    cancel_on_tap_outside: true
  });
  google.accounts.id.prompt((notification) => {
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      // Fallback: render a proper button
      const wrap = document.createElement("div");
      document.querySelector(".panel").prepend(wrap);
      google.accounts.id.renderButton(wrap, { theme:"outline", size:"large", width:360 });
    }
  });
}

async function handleGoogleCredential(response) {
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";

  const payload = JSON.parse(atob(response.credential.split(".")[1]));
  const email   = payload.email || "";
  const sub     = payload.sub   || "";

  try {
    const users = await fetchUsers();

    // Match by google sub hash (password field for Google users = hash of "google_" + sub)
    const expectedHash = await hashPassword("google_" + sub);
    let match = users.find(u => String(u.password) === expectedHash);

    // Fallback: match by email stored in phone field (legacy) or username
    if (!match) {
      match = users.find(u =>
        String(u.username).toLowerCase() === email.split("@")[0].toLowerCase()
      );
    }

    if (!match) {
      // No account found — redirect to signup with a hint
      errEl.textContent = "No account found for this Google account. Please sign up first.";
      setTimeout(() => { window.location.href = "signup.html"; }, 2000);
      return;
    }

    // Check approval
    if (String(match.approved).toUpperCase() !== "TRUE") {
      const msg = encodeURIComponent(`Hi, I signed up for Card Table with username "${match.username}" and I'm waiting for approval.`);
      document.getElementById("pendingWhatsApp").href =
        `https://wa.me/${ADMIN_WA.replace(/\D/g,"")}?text=${msg}`;
      document.getElementById("pendingBox").style.display = "";
      return;
    }

    startSession(match);

  } catch(e) {
    errEl.textContent = "Google sign-in failed: " + e.message;
  }
}

function startSession(user) {
  sessionStorage.setItem("cg_session", JSON.stringify({
    username:  user.username,
    firstName: user.firstName,
    lastName:  user.lastName,
    phone:     user.phone  || "",
    image:     user.image  || "",
    isAdmin:   !!user.isAdmin
  }));
  window.location.href = "app.html";
}
</script>
</body>
</html>
