<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Table — My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" style="max-width: 480px;">
  <div class="brand">
    <h1>My Profile</h1>
    <div class="user-chip" id="userChip"></div>
  </div>

  <div class="panel">
    <p class="eyebrow">Account</p>
    <h2 style="margin-top:0;">Edit your details</h2>

    <label for="username">Username</label>
    <input type="text" id="username">

    <label for="firstName">First name</label>
    <input type="text" id="firstName">

    <label for="lastName">Last name</label>
    <input type="text" id="lastName">

    <label for="phone">Phone number</label>
    <input type="text" id="phone" placeholder="+961...">

    <label>Profile photo</label>
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:6px;">
      <img id="imagePreview" src="" alt=""
        style="width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); background:rgba(0,0,0,0.2);">
      <div style="flex:1;">
        <input type="file" id="imageFile" accept="image/*" style="padding:8px; font-size:0.85rem;">
        <div style="font-size:0.72rem; opacity:0.6; margin-top:6px;">
          Pick from your photo library or take a photo. Auto-resized before upload.
        </div>
      </div>
    </div>

    <label for="password">New password</label>
    <input type="password" id="password" placeholder="Leave blank to keep current password" autocomplete="new-password">

    <div class="error" id="profileError"></div>
    <div id="profileSuccess" style="color:var(--gold-soft); font-size:0.85rem; margin-top:10px; min-height:1.2em;"></div>
    <button class="full" id="saveBtn" style="margin-top:18px;">Save changes</button>
  </div>

  <div class="bottom-nav" style="margin-top:10px;">
    <a class="btn secondary" href="app.html">← Back to games</a>
  </div>
</div>

<script src="hash.js"></script>
<script src="common.js"></script>
<script>
const session = requireLogin();
if (session) renderUserChip(session);

// Pre-fill fields
document.getElementById("username").value  = session.username  || "";
document.getElementById("firstName").value = session.firstName || "";
document.getElementById("lastName").value  = session.lastName  || "";
document.getElementById("phone").value     = session.phone     || "";

const defaultImageUrl = () =>
  "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(session.firstName || "U");

document.getElementById("imagePreview").src = session.image || defaultImageUrl();

// pendingImage holds the resized base64 data URL when a photo is chosen
let pendingImageDataUrl = null;

document.getElementById("imageFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const errEl = document.getElementById("profileError");
  errEl.textContent = "";
  document.getElementById("profileSuccess").textContent = "";
  try {
    const dataUrl = await resizeImage(file, 300, 0.7); // small enough to fit in a Sheet cell
    pendingImageDataUrl = dataUrl;
    document.getElementById("imagePreview").src = dataUrl;
  } catch (err) {
    errEl.textContent = "Could not process that image: " + err.message;
  }
});

// Resize image and return a data URL (data:image/jpeg;base64,...)
function resizeImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not load image"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width  = maxDim;
        } else if (height > maxDim) {
          width  = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById("saveBtn").addEventListener("click", saveProfile);

async function saveProfile() {
  const errEl     = document.getElementById("profileError");
  const successEl = document.getElementById("profileSuccess");
  errEl.textContent = "";
  successEl.textContent = "";

  const newUsername = document.getElementById("username").value.trim();
  const firstName   = document.getElementById("firstName").value.trim();
  const lastName    = document.getElementById("lastName").value.trim();
  const phone       = document.getElementById("phone").value.trim();
  const password    = document.getElementById("password").value;

  if (!newUsername || !firstName || !lastName) {
    errEl.textContent = "Username, first name, and last name are required.";
    return;
  }

  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  btn.textContent = "Saving…";

  try {
    // Build fields — include the image data URL directly if a new one was chosen.
    // No separate upload step needed: updateUser writes it straight to the sheet cell.
    const fields = { username: newUsername, firstName, lastName, phone };
    if (password)           fields.password = await hashPassword(password);
    if (pendingImageDataUrl) fields.image   = pendingImageDataUrl;

    await updateUser(session.username, fields);

    // Update session
    const imageUrl = pendingImageDataUrl || session.image || "";
    const updatedSession = { ...session, username: newUsername, firstName, lastName, phone, image: imageUrl };
    sessionStorage.setItem("cg_session", JSON.stringify(updatedSession));

    pendingImageDataUrl = null;
    successEl.textContent = "✓ Profile saved.";
    renderUserChip(updatedSession);
    document.getElementById("imagePreview").src = imageUrl || defaultImageUrl();

  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Save changes";
  }
}
</script>
</body>
</html>
