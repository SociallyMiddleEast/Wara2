<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Table — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
.auth-links {
  display: flex;
  justify-content: center;
  margin-top: 18px;
}
.auth-links a {
  font-size: .83rem;
  opacity: .65;
  text-decoration: none;
  color: inherit;
  transition: opacity .15s;
}
.auth-links a:hover { opacity: 1; }

/* Divider */
.or-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 0;
  opacity: .45;
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.or-divider::before, .or-divider::after {
  content: "";
  flex: 1;
  border-top: 1px solid var(--line);
}

/* Google button */
.google-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: #fff;
  color: #3c4043;
  border: 1px solid #dadce0;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: .92rem;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: box-shadow .15s, background .15s;
}
.google-btn:hover { background: #f8f9fa; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
.google-btn svg { flex-shrink: 0; }

/* Google pre-fill panel */
.google-prefill {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 16px;
}
.google-prefill img {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}
.google-prefill .gp-info { flex: 1; min-width: 0; }
.google-prefill .gp-name { font-weight: 600; font-size: .9rem; }
.google-prefill .gp-email { font-size: .75rem; opacity: .55; margin-top: 2px; }
.google-prefill .gp-change {
  font-size: .72rem;
  opacity: .5;
  cursor: pointer;
  text-decoration: underline;
  background: none;
  border: none;
  color: inherit;
  padding: 0;
  flex-shrink: 0;
}

/* Success */
.success-box { text-align: center; padding: 10px 0; }
.success-box .sb-icon { font-size: 2.5rem; margin-bottom: 10px; }
.success-box h3 { margin: 0 0 8px; font-family: 'Fraunces', serif; }
.success-box p { font-size: .85rem; opacity: .75; line-height: 1.6; margin: 0 0 18px; }
.wa-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: #25D366; color: #fff;
  border: none; border-radius: 10px;
  padding: 12px 22px; font-size: .92rem; font-weight: 700;
  cursor: pointer; text-decoration: none;
  font-family: 'Inter', sans-serif;
}
</style>
</head>
<body>
<div class="wrap" style="max-width:420px;">
  <div class="brand" style="justify-content:center; border-bottom:none; margin-bottom:36px;">
    <div style="text-align:center;">
      <div class="suit" style="display:block; margin-bottom:6px; font-size:1.4rem; letter-spacing:.4em;">♠ ♥ ♦ ♣</div>
      <h1>Card Table</h1>
    </div>
  </div>

  <!-- Sign up form -->
  <div class="panel" id="formPanel">
    <p class="eyebrow">New account</p>
    <h2 style="margin-top:0;">Sign up</h2>

    <!-- Google sign-in button (shown when no Google session) -->
    <div id="googleBtnWrap">
      <button class="google-btn" id="googleBtn" onclick="triggerGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
          <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
          <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
          <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/>
        </svg>
        Sign up with Google
      </button>
      <div class="or-divider">or</div>
    </div>

    <!-- Google pre-fill card (shown after Google sign-in) -->
    <div class="google-prefill" id="googlePrefill" style="display:none;">
      <img id="googleAvatar" src="" alt="">
      <div class="gp-info">
        <div class="gp-name" id="googleDisplayName"></div>
        <div class="gp-email" id="googleEmail"></div>
      </div>
      <button class="gp-change" onclick="resetGoogleSignIn()">Change</button>
    </div>

    <!-- Name fields (hidden when Google is used) -->
    <div id="manualNameFields">
      <label for="firstName">First name</label>
      <input type="text" id="firstName" autocomplete="given-name" placeholder="Elie">
      <label for="lastName" style="margin-top:10px;">Last name</label>
      <input type="text" id="lastName" autocomplete="family-name" placeholder="Zaarour">
    </div>

    <label for="username" style="margin-top:10px;">Username</label>
    <input type="text" id="username" autocomplete="username" placeholder="elie"
      style="text-transform:lowercase;">

    <label for="phone" style="margin-top:10px;">Phone number</label>
    <input type="text" id="phone" autocomplete="tel" placeholder="+961 XX XXX XXX">

    <!-- Password fields (hidden when Google is used) -->
    <div id="passwordFields">
      <label for="password" style="margin-top:10px;">Password</label>
      <input type="password" id="password" autocomplete="new-password" placeholder="••••••••">
      <label for="confirm" style="margin-top:10px;">Confirm password</label>
      <input type="password" id="confirm" autocomplete="new-password" placeholder="••••••••">
    </div>

    <div class="error" id="signupError"></div>
    <button class="full" id="signupBtn" style="margin-top:18px;">Create account</button>

    <div class="auth-links">
      <a href="index.html">Already have an account? Sign in</a>
    </div>
  </div>

  <!-- Success state -->
  <div class="panel" id="successPanel" style="display:none;">
    <div class="success-box">
      <div class="sb-icon">🎉</div>
      <h3>Account created!</h3>
      <p>
        Your account is pending approval by the admin.<br>
        Tap the button below to message them on WhatsApp —
        once approved you'll be able to sign in.
      </p>
      <a id="waLink" href="#" target="_blank" rel="noopener" class="wa-btn">
        💬 Message admin on WhatsApp
      </a>
      <br><br>
      <a href="index.html" style="font-size:.82rem;opacity:.6;color:inherit;text-decoration:none;">
        ← Back to sign in
      </a>
    </div>
  </div>
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="common.js"></script>
<script>
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data     = encoder.encode(password);
  const hashBuf  = await crypto.subtle.digest("SHA-256", data);
  const hashArr  = Array.from(new Uint8Array(hashBuf));
  return hashArr.map(b => b.toString(16).padStart(2, "0")).join("");
}
</script>
<script>
const ADMIN_WA      = "+96170234138";
const GOOGLE_CLIENT = "719090679294-4ihaptgq611pqusbl5u95uiu03cabtub.apps.googleusercontent.com";

// Google sign-in state
let googleUser = null; // { firstName, lastName, email, photo, sub }

// ── Lowercase username as user types ──
document.getElementById("username").addEventListener("input", e => {
  const el = e.target, pos = el.selectionStart;
  el.value = el.value.toLowerCase();
  el.setSelectionRange(pos, pos);
});

// ── Google sign-in trigger ──
function triggerGoogleSignIn() {
  if (typeof google === "undefined") {
    document.getElementById("signupError").textContent = "Google sign-in failed to load. Please try the manual form below.";
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT,
    callback:  handleGoogleCredential,
    auto_select: false,
    cancel_on_tap_outside: true
  });
  google.accounts.id.prompt((notification) => {
    // If one-tap is suppressed, fall back to popup
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      google.accounts.id.renderButton(
        document.getElementById("googleBtn"),
        { theme:"outline", size:"large", width:360 }
      );
    }
  });
}

// ── Handle Google credential response ──
function handleGoogleCredential(response) {
  // Decode the JWT payload (no verification needed client-side — server-side not needed here since we just pre-fill)
  const payload = JSON.parse(atob(response.credential.split(".")[1]));
  googleUser = {
    firstName: payload.given_name  || "",
    lastName:  payload.family_name || "",
    email:     payload.email       || "",
    photo:     payload.picture     || "",
    sub:       payload.sub         || ""
  };

  // Pre-fill and hide manual name + password fields
  document.getElementById("googlePrefill").style.display    = "";
  document.getElementById("googleBtnWrap").style.display    = "none";
  document.getElementById("manualNameFields").style.display = "none";
  document.getElementById("passwordFields").style.display   = "none";

  document.getElementById("googleAvatar").src      = googleUser.photo;
  document.getElementById("googleDisplayName").textContent = `${googleUser.firstName} ${googleUser.lastName}`;
  document.getElementById("googleEmail").textContent       = googleUser.email;

  // Pre-fill username from first name (lowercased, letters only)
  const suggested = googleUser.firstName.toLowerCase().replace(/[^a-z0-9_]/g, "");
  document.getElementById("username").value = suggested;
  document.getElementById("username").focus();
}

function resetGoogleSignIn() {
  googleUser = null;
  document.getElementById("googlePrefill").style.display    = "none";
  document.getElementById("googleBtnWrap").style.display    = "";
  document.getElementById("manualNameFields").style.display = "";
  document.getElementById("passwordFields").style.display   = "";
  document.getElementById("googleAvatar").src               = "";
  document.getElementById("googleDisplayName").textContent  = "";
  document.getElementById("googleEmail").textContent        = "";
}

// ── Sign up ──
document.getElementById("signupBtn").addEventListener("click", signUp);
["firstName","lastName","username","phone","password","confirm"].forEach(id => {
  document.getElementById(id).addEventListener("keydown", e => {
    if (e.key === "Enter") signUp();
  });
});

async function signUp() {
  const errEl = document.getElementById("signupError");
  errEl.textContent = "";

  const username = document.getElementById("username").value.trim().toLowerCase();
  const phone    = document.getElementById("phone").value.trim();

  // Get name from Google or manual fields
  const firstName = googleUser
    ? googleUser.firstName
    : document.getElementById("firstName").value.trim();
  const lastName = googleUser
    ? googleUser.lastName
    : document.getElementById("lastName").value.trim();

  // Get password — Google users get a random secure hash (they log in via Google)
  let passwordHash;
  if (googleUser) {
    // Use Google sub as the password base — unique, user can't guess it
    // They'll always sign in via Google, never need to type this
    passwordHash = await hashPassword("google_" + googleUser.sub);
  } else {
    const password = document.getElementById("password").value;
    const confirm  = document.getElementById("confirm").value;
    if (!password) { errEl.textContent = "Enter a password."; return; }
    if (password.length < 4) { errEl.textContent = "Password must be at least 4 characters."; return; }
    if (password !== confirm) { errEl.textContent = "Passwords don't match."; return; }
    passwordHash = await hashPassword(password);
  }

  // Validation
  if (!firstName || !lastName) { errEl.textContent = "First and last name are required."; return; }
  if (!username) { errEl.textContent = "Choose a username."; return; }
  if (username.length < 3) { errEl.textContent = "Username must be at least 3 characters."; return; }
  if (!/^[a-z0-9_]+$/.test(username)) {
    errEl.textContent = "Username can only contain letters, numbers, and underscores."; return;
  }

  const btn = document.getElementById("signupBtn");
  btn.disabled = true;
  btn.textContent = "Creating account…";

  try {
    const res = await fetch(SHEET_API_URL, {
      method:  "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body:    JSON.stringify({
        action: "signUp",
        username,
        firstName,
        lastName,
        phone,
        password: passwordHash,
        image:    googleUser ? googleUser.photo : "",
        googleSignIn: !!googleUser
      })
    });
    const data = await res.json();

    if (data.error) {
      errEl.textContent = data.error;
      btn.disabled = false;
      btn.textContent = "Create account";
      return;
    }

    // Success
    const msg = encodeURIComponent(
      `Hi, I just signed up for Card Table with username "${username}" (${firstName} ${lastName}). Please approve my account!`
    );
    document.getElementById("waLink").href =
      `https://wa.me/${ADMIN_WA.replace(/\D/g,"")}?text=${msg}`;

    document.getElementById("formPanel").style.display    = "none";
    document.getElementById("successPanel").style.display = "";

  } catch(e) {
    errEl.textContent = "Could not connect. " + e.message;
    btn.disabled = false;
    btn.textContent = "Create account";
  }
}
</script>
</body>
</html>
